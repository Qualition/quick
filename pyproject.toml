[build-system]
requires = ["setuptools >= 69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quick-core"
version = "0.0.0"
dependencies = [
    "cirq-core == 1.5.0",
    "genQC == 0.2.3",
    "numpy >= 1.23,< 3.0",
    "pennylane == 0.42.3",
    "pytket == 2.9.3",
    "pytket-qiskit == 0.71.1",
    "pytket-cirq == 0.41.0",
    "qiskit == 2.2.1",
    "qiskit_aer == 0.17.2",
    "qiskit_ibm_runtime == 0.42.0",
    "qiskit-transpiler-service == 0.4.14",
    "quimb == 1.11.2",
    "tket2 == 0.12.0"
]
requires-python = ">=3.10, <3.13"
authors = [
  {name = "Amir Ali Malekani Nezhad", email = "amiralimlk07@gmail.com"},
]
maintainers = [
  {name = "Amir Ali Malekani Nezhad", email = "amiralimlk07@gmail.com"}
]
description = "quick is an agnostic gate-based circuit SDK, providing an integrated interface for using any supported quantum circuit framework seamlessly."
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["quantum computing", "quantum circuit", "quantum compiler"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
dev = [
  "ruff == 0.13.2",
  "mypy == 1.18.2",
  "pytest == 8.4.2",
  "pytest-mock == 3.15.1",
  "pytest-cov == 7.0.0",
  "coverage == 7.10.7",
]

[project.urls]
Repository = "https://github.com/qualition/quick.git"
"Bug Tracker" = "https://github.com/qualition/quick/issues"

[tool.setuptools.packages.find]
include = ["quick*"]

[tool.setuptools.package-data]
"quick" = ["py.typed"]

[tool.codeflash]
# All paths are relative to this pyproject.toml's directory.
module-root = "quick"
tests-root = "tests"
test-framework = "pytest"
ignore-paths = []
formatter-cmds = ["disabled"]
